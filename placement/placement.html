<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimLoad Manager - Placement Editor</title>
<!--
  SimLoad Manager 6.0 - vehicle placement editor (CEF window, X-Plane only).
  Opened from Plugins > SimLoad Manager > Placement Editor; never served on the
  local network (this folder is outside ui/).
  Contract (docs/slm6/PLACEMENT_EDITOR.md section 12.3): the page asks for the
  editor state with xplane.slmPlacementState({ v }) about 4 times a second (gets
  the full state when it changed, else { v }) and sends actions with
  xplane.slmPlacementAction({ name, arg }). Everything is decided by the plugin
  (slm5/src/vehicles/editor.cpp). During a drag the page draws with its own copy
  of the path engine (port of slm5/src/vehicles/path.cpp) and sends one action
  at the end of the gesture.
  Texts: lang/<code>.json of the main window (keys placement.*), sent by
  slm.onLang(dict). No text in this file.
  No continuous animation (CLAUDE.md), except Play path while it plays
  (spec section 12.4, to be measured).
  Self-contained on purpose (the plugin may inject it if file:// is refused).
-->
<style>
:root{
  color-scheme:dark;
  --bg:#0E1217; --bg2:#0A0E12; --panel:#121820; --line:#222C37; --line2:#2E3A48;
  --text:#E6EBF1; --text2:#C3CDD8; --muted:#8A97A6; --faint:#5D6B7A;
  --accent:#FFD166; --accent-ink:#1A1400; --ok:#43D19E; --warn:#FF9B54; --crit:#FF5C5C; --info:#6CB6FF;
  --pax:#6CB6FF; --cab:#C39BFF; --cgo:#FF9B54; --svc:#43D19E; --rev:#FF6BD5; --flow:#5FE0D2; --staff:#F5A3C7; --link:#F5C26B;
  --f-body:"Segoe UI",system-ui,sans-serif;
  --f-mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:12px;overflow:hidden;-webkit-user-select:none;user-select:none}
button,select,input{font-family:inherit;font-size:12px;color:var(--text)}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grip{position:fixed;right:0;bottom:0;width:16px;height:16px;z-index:50;cursor:nwse-resize;color:var(--muted)}
.grip:hover{color:var(--accent)}
.app{display:flex;flex-direction:column;height:100%;border:1px solid #2B3644}
.top{height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 12px;background:#0A0D11;border-bottom:1px solid var(--line);cursor:move}
.top .brand{font-family:var(--f-mono);font-weight:600;color:var(--accent);letter-spacing:.08em;margin-right:10px}
.top .ttl{color:var(--text2)} .top .ttl b{color:var(--text);font-weight:500}
.iconbtn{width:28px;height:24px;border:0;border-radius:4px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.iconbtn:hover{background:#1A222C;color:var(--text)}
.iconbtn.txt{font-size:11px;font-weight:600;width:auto;padding:0 6px}
/* Text size (A- / A+): panels only, the map keeps its mouse coordinates unzoomed */
.bar,.left,.insp,.status,.dlg{zoom:var(--uiz,1)}
.bar{min-height:52px;flex-shrink:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 12px;white-space:nowrap;background:var(--panel);border-bottom:1px solid var(--line)}
.lab{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.col{display:flex;flex-direction:column;gap:2px}
.btn{height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--line2);background:var(--bg);display:inline-flex;align-items:center;gap:6px;font-weight:600}
.btn:hover:not(:disabled){border-color:#3D4C5E}
.btn.small{height:26px;padding:0 8px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border:0;font-weight:700}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--crit)}
.sel,.inp{height:26px;padding:0 6px;border-radius:5px;border:1px solid var(--line2);background:var(--bg)}
.inp{width:64px;-webkit-user-select:text;user-select:text}
.inp.wide{width:100%}
.badge{height:20px;padding:0 8px;display:inline-flex;align-items:center;gap:6px;border-radius:10px;font-size:11px}
.badge.mod{background:#2A2310;color:var(--accent)} .badge.ok{background:#10261E;color:var(--ok)}
.badge.warn{background:#2B1A0E;color:var(--warn)} .badge.err{background:#2B1010;color:var(--crit)}
.body{flex:1;min-height:0;display:flex}
.left{width:250px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.seg{display:grid;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--bg);color:var(--text2);min-height:30px;padding:3px 2px;font-weight:600}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:#2A2310;color:var(--accent)}
.seg .sub{display:block;font-size:9px;font-weight:500;opacity:.85}
.list{flex:1;overflow-y:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:10px}
.grp-h{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 2px;font-size:11px;font-weight:600;color:var(--text2)}
.grp-h .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.row{display:flex;align-items:center;gap:8px;min-height:34px;padding:3px 6px;border-radius:6px;border:1px solid transparent;background:transparent;width:100%;text-align:left;color:var(--text)}
.row:hover{background:#18202A}
.row.on{border-color:var(--accent);background:#1E1A0E}
.row .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.row .nm b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{font-size:10px;font-family:var(--f-mono);color:var(--muted)}
.row.hid{opacity:.45}
.plus{width:22px;height:22px;border-radius:4px;border:1px solid var(--line2);background:transparent;color:var(--muted);font-size:14px;line-height:1}
.center{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.canvas-wrap{flex:1;min-height:0;position:relative;margin:8px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg2)}
svg#map{width:100%;height:100%;display:block;touch-action:none;cursor:default}
svg#map.panning{cursor:grabbing}
svg#map *{pointer-events:none} svg#map [data-hdl],svg#map [data-veh],svg#map [data-veh] *{pointer-events:auto}
.map-tools{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.map-tools .btn{height:26px;background:rgba(14,18,23,.9)}
.zoom{position:absolute;left:8px;bottom:8px;font-family:var(--f-mono);font-size:10px;color:var(--muted);background:rgba(10,14,18,.85);padding:2px 6px;border-radius:4px}
.insp{width:300px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.insp h3{margin:0;font-size:13px}
.insp .sec{display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center}
.flex{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{height:22px;padding:0 8px;border-radius:11px;border:1px solid var(--line2);background:var(--bg);color:var(--text2);font-size:11px}
.chip.on{border-color:var(--accent);color:var(--accent);background:#2A2310}
.msg{font-size:11px;line-height:1.4;padding:6px 8px;border-radius:6px}
.msg.crit{background:#2B1010;color:#FF9A9A} .msg.warn{background:#2B1A0E;color:#FFC28F}
.msg.info{background:#10202B;color:#9CCBFF} .msg.ok{background:#10261E;color:#8FE6C2}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:11px;line-height:1.35}
.check li{display:grid;grid-template-columns:14px 1fr;gap:4px} .check .ok{color:#8FE6C2} .check .todo{color:#FFC28F} .check .adv{color:#8A96A3}
.nodes{display:flex;flex-direction:column;gap:4px}
.node{display:grid;grid-template-columns:44px auto 1fr;gap:4px;align-items:center}
.node .k{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.segrow{display:flex;gap:6px;align-items:center;padding-left:44px;font-size:11px;color:var(--muted)}
.node.hdr span{font-size:10px;color:var(--muted)} .node.hdr span:nth-child(2){min-width:108px}
.route{display:flex;flex-direction:column;padding:4px 0}
.rrow{display:flex;align-items:center;gap:5px;min-height:30px}
.insp{overflow-x:hidden}
.rrow .mk{width:20px;height:20px;flex-shrink:0;border-radius:50%;border:2px solid var(--accent);background:var(--bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:9px;font-weight:700;box-sizing:border-box}
.rrow .mk.end{background:var(--accent);color:#1A1400}
.rname{font-size:12px;font-weight:500;white-space:nowrap}
.rxz{flex:1 1 0;min-width:0;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:1px;font-family:var(--f-mono);font-size:10px;color:var(--muted);white-space:nowrap}
.inp.bare{width:36px;height:20px;padding:0 2px;border-color:transparent;background:transparent;color:var(--muted);font-size:10px;text-align:right}
.inp.bare:hover,.inp.bare:focus{border-color:var(--line2);background:var(--bg);color:var(--text)}
.pill{height:22px;padding:0 6px;border-radius:11px;border:1px solid var(--line2);background:transparent;color:var(--muted);font-size:10px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:4px}
.pill.on{border-color:#5C4A1C;background:#2A2310;color:var(--accent)}
.pill select{border:0;background:transparent;color:inherit;font-size:10px;font-weight:600;padding:0;outline:none;cursor:pointer}
.pill option{background:var(--bg);color:var(--text)}
.rrow .x{width:20px;height:20px;border:0;background:transparent;color:var(--muted);font-size:13px;padding:0}
.rseg{display:flex;align-items:center;gap:6px;height:36px}
.rline{width:2px;align-self:stretch;margin:0 9px;flex-shrink:0}
.fr{display:flex;height:26px;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
.fr button{padding:0 8px;border:0;background:var(--bg);color:var(--muted);font-size:11px;font-weight:600}
.fr button+button{border-left:1px solid var(--line2)}
.fr button.on{background:var(--accent);color:#1A1400} .fr button.on.rev{background:#F08CFF;color:#24072A}
.fr button:disabled{color:#3E4A58}
.sq{width:24px;height:24px;border-radius:4px;border:1px solid var(--line2);background:var(--bg);color:var(--text2);padding:0}
.rissue{margin:0 0 6px 26px;padding:6px 8px;border-radius:5px;background:#2A1416;border:1px solid #5C2328;color:#FFB3B3;font-size:11px;line-height:1.4}
.slowbox{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.lab2{font-size:11px;color:var(--text2);font-weight:600}
.btn.play{border-color:#5C4A1C;background:#2A2310;color:var(--accent)}
.status{height:26px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 22px 0 12px;background:#0A0D11;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
.status .sp{flex:1}
.ovl{position:fixed;inset:0;background:rgba(5,8,11,.6);display:flex;align-items:center;justify-content:center;z-index:10}
.dlg{width:420px;max-height:80%;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.dlg h2{margin:0;font-size:15px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:4px}
.tile{display:flex;align-items:center;gap:7px;min-height:38px;padding:4px 7px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);text-align:left;font-weight:600;font-size:12px;line-height:1.2}
.tile:hover{border-color:#3D4C5E}
.tile.on{border-color:var(--accent);background:#2A2310}
.tile i{flex:none;width:9px;height:9px;border-radius:2px}
.tile .sub{display:block;font-size:10px;font-weight:400;color:var(--muted)}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.empty .card{pointer-events:auto;width:440px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.empty h2{margin:0;font-size:15px}
.hint{font-size:11px;color:var(--muted);line-height:1.45}
label.chk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text2)}
[hidden]{display:none!important}
</style>
</head>
<body>
<svg class="grip" id="grip" viewBox="0 0 16 16"><path d="M14 5 L5 14 M14 9 L9 14 M14 13 L13 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
<div class="app">
  <div class="top" id="top">
    <div><span class="brand">SLM</span><span class="ttl" data-i18n="placement.ui.title"></span></div>
    <div class="flex" style="gap:2px;flex-wrap:nowrap">
    <button class="iconbtn txt" id="b-font-dn" data-i18n-title="placement.ui.text_smaller">A−</button>
    <button class="iconbtn txt" id="b-font-up" data-i18n-title="placement.ui.text_larger">A+</button>
    <button class="iconbtn" id="b-close" data-i18n-title="placement.ui.close">
      <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2 L10 10 M10 2 L2 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    </div>
  </div>
  <div class="bar">
    <div class="col"><span class="lab" data-i18n="placement.ui.loaded_aircraft"></span><b id="acf-name"></b></div>
    <div class="col"><span class="lab" data-i18n="placement.ui.editing"></span>
      <div class="flex"><select class="sel" id="prof" style="min-width:200px"></select><span id="dirty"></span></div></div>
    <div style="flex:1"></div>
    <button class="btn small" id="b-check"></button>
    <button class="btn small" id="b-undo" data-i18n="placement.ui.undo"></button>
    <button class="btn small" id="b-redo" data-i18n="placement.ui.redo"></button>
    <div class="flex" style="flex-wrap:nowrap"><select class="sel" id="prev-phase"></select><button class="btn small" id="b-prev-stop" data-i18n="placement.ui.preview_stop"></button></div>
    <button class="btn" id="b-rename" data-i18n="placement.ui.rename"></button>
    <button class="btn" id="b-new" data-i18n="placement.ui.new_profile"></button>
    <button class="btn primary" id="b-save" data-i18n="placement.ui.save"></button>
  </div>
  <div class="body">
    <div class="left">
      <div style="padding:10px 8px 0;display:flex;flex-direction:column;gap:6px">
        <span class="lab" data-i18n="placement.ui.stand_config"></span>
        <div class="seg" id="cfgs" style="grid-template-columns:repeat(3,1fr)"></div>
        <div class="flex"><span class="hint" data-i18n="placement.ui.reuse_from"></span><select class="sel" id="reuse" style="flex:1"></select></div>
      </div>
      <div style="padding:8px">
        <div class="seg" id="tabs" style="grid-template-columns:repeat(3,1fr)">
          <button data-tab="veh" data-i18n="placement.ui.tab_vehicles"></button>
          <button data-tab="pts" data-i18n="placement.ui.tab_points"></button>
          <button data-tab="ppl" data-i18n="placement.ui.tab_people"></button>
        </div>
      </div>
      <div class="list" id="list"></div>
    </div>
    <div class="center">
      <div class="canvas-wrap">
        <svg id="map"></svg>
        <div class="map-tools">
          <button class="btn small" id="b-paths" data-i18n="placement.ui.show_paths"></button>
          <button class="btn small" id="b-snap" data-i18n="placement.ui.snap"></button>
          <button class="btn small" id="b-recenter" data-i18n="placement.ui.recenter"></button>
        </div>
        <div class="zoom" id="zoom"></div>
        <div class="empty" id="empty" hidden>
          <div class="card">
            <h2 data-i18n="placement.no_profile"></h2>
            <span class="hint" id="empty-sub"></span>
            <button class="btn primary" id="b-empty-new" data-i18n="placement.ui.create_profile"></button>
            <button class="btn" id="b-empty-copy" data-i18n="placement.ui.start_from_other"></button>
            <span class="hint" data-i18n="placement.ui.drop_hint"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="insp" id="insp"></div>
  </div>
  <div class="status">
    <span data-i18n="placement.ui.datum"></span>
    <span id="st-geo"></span>
    <span class="sp"></span>
    <span id="st-msg"></span>
    <span id="st-alerts"></span>
  </div>
</div>
<div class="ovl" id="ovl" hidden><div class="dlg" id="dlg"></div></div>

<script>
(function () {
  "use strict";
  var L = {};                 // language dictionary (slm.onLang)
  var S = null;               // editor state from the plugin
  var slm = window.slm = {};
  var $ = function (id) { return document.getElementById(id); };
  function t(key, vars) {
    var s = Object.prototype.hasOwnProperty.call(L, key) ? L[key] : key;
    if (vars) Object.keys(vars).forEach(function (k) { s = s.split("{" + k + "}").join(String(vars[k])); });
    return s;
  }
  function tm(m) {  // { key, vars } message; configs, config, route, vehicle uid and flow id shown as names
    if (!m || !m.key) return "";
    var v = m.vars;
    if (v) {
      v = Object.assign({}, v);
      var p = profile(), cfg = p && p.configs && p.configs[v.config], pc = p && p.people && p.people[v.config];
      if (v.configs) v.configs = v.configs.split(",").map(function (c) { return t("placement.config." + c); }).join(", ");
      if (v.route) v.route = t("placement.ui." + v.route);
      if (v.uid && m.key !== "placement.issue.uid") {
        var veh = ((cfg && cfg.vehicles) || []).filter(function (x) { return x.uid === v.uid; })[0];
        if (veh) v.uid = typeName(veh.type) + " (" + ((point(veh.point) || {}).tag || veh.point) + ")";
      }
      if (v.flow) {
        var fl = ((pc && pc.flows) || []).filter(function (x) { return x.id === v.flow; })[0];
        if (fl && fl.door) v.flow = (point(fl.door) || {}).tag || fl.door;
      }
      if (v.config) v.config = t("placement.config." + v.config);
    }
    return t(m.key, v);
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function f1(n) { return (Math.round(n * 10) / 10).toFixed(1); }
  var CAT_COLOR = { pax: "var(--pax)", cab: "var(--cab)", cgo: "var(--cgo)", svc: "var(--svc)" };
  var CAT_HEX = { pax: "#6CB6FF", cab: "#C39BFF", cgo: "#FF9B54", svc: "#43D19E" };
  var CATS = ["pax", "cab", "cgo", "svc"];
  var STOPS = [0, 5, 10, 20, 30, 60];
  var ENTRY_DELAYS = [0, 5, 10, 20, 30, 60, 90, 120, 180, 300];  // wait at the entry point before driving off
  var CLOCK = '<svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M5 2.8 V5 L6.6 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>';

  // ---- Plugin calls --------------------------------------------------------------
  function action(name, arg) {
    if (window.xplane && typeof xplane.slmPlacementAction === "function") xplane.slmPlacementAction({ name: name, arg: arg || {} });
  }
  function win(op, v) {
    if (window.xplane && typeof xplane.slmWindow === "function") xplane.slmWindow(v === undefined ? { op: op } : { op: op, v: v });
  }
  var version = -1, polling = false;
  function poll() {
    if (polling || !window.xplane || typeof xplane.slmPlacementState !== "function") return;
    polling = true;
    Promise.resolve(xplane.slmPlacementState({ v: version })).then(function (r) {
      polling = false;
      if (typeof r === "string") r = JSON.parse(r);
      if (!r || r.v === undefined || r.v === version || !r.aircraft) { if (r && r.v !== undefined) version = r.v; return; }
      version = r.v;
      slm.onState(r);
    }, function () { polling = false; });
  }
  setInterval(poll, 250);

  // ---- Path engine (port of slm5/src/vehicles/path.cpp) -----------------------------
  var TAU = Math.PI * 2;
  function modt(a) { return ((a % TAU) + TAU) % TAU; }
  function wrap180(d) { d = ((d + 180) % 360 + 360) % 360; return d - 180; }
  function cat(type) { var c = catalog(type); return c ? c.category : "svc"; }
  function catalog(type) { return S && S.catalog ? S.catalog.filter(function (c) { return c.type === type; })[0] : null; }
  // Profile vehicle (JSON) -> engine vehicle.

    closeDialog();
  }

  // ---- Buttons ---------------------------------------------------------------------
  $("b-close").addEventListener("click", function () { win("close"); });
  function setFont(v) {  // text size of the panels, 80..160 %
    ui.font = Math.max(80, Math.min(160, Number(v) || 100));
    document.documentElement.style.setProperty("--uiz", String(ui.font / 100));
  }
  setFont(ui.font);
  $("b-font-dn").addEventListener("click", function () { setFont(ui.font - 10); keep(); renderAll(); });
  $("b-font-up").addEventListener("click", function () { setFont(ui.font + 10); keep(); renderAll(); });
  $("b-check").addEventListener("click", function () { ui.sel = null; renderList(); renderInsp(); });
  $("b-undo").addEventListener("click", function () { action("undo"); });
  $("b-redo").addEventListener("click", function () { action("redo"); });
  $("b-save").addEventListener("click", function () { action("save"); });
  $("b-new").addEventListener("click", function () { openNew(); });
  $("b-rename").addEventListener("click", openRename);
  $("b-empty-new").addEventListener("click", function () { openNew(); });
  $("b-empty-copy").addEventListener("click", function () { openNew(true); });
  $("b-prev-stop").addEventListener("click", function () { action("preview_stop"); });
  $("b-paths").addEventListener("click", function () { ui.paths = !ui.paths; keep(); renderAll(); });
  $("b-snap").addEventListener("click", function () { ui.snap = !ui.snap; keep(); renderAll(); });
  $("b-recenter").addEventListener("click", function () { recenter(); renderMap(); });
  window.addEventListener("resize", function () { renderMap(); });

  // ---- Window: drag by the top bar, resize by the corner grip (X-Plane does not resize
  // a CEF window by its edges), keyboard hand-back (as the main window) --------
  var dragging = false;
  $("top").addEventListener("mousedown", function (e) { if (e.button !== 0 || e.target.closest("button")) return; e.preventDefault(); dragging = true; win("drag"); });
  $("grip").addEventListener("mousedown", function (e) { if (e.button !== 0) return; e.preventDefault(); dragging = true; win("resize"); });
  function drop() { if (dragging) { dragging = false; win("drop"); } }
  document.addEventListener("mouseup", drop);
  document.addEventListener("mousemove", function (e) { if (dragging && !(e.buttons & 1)) drop(); });
  window.addEventListener("blur", drop);
  function typingField(el) { return el && el.matches && el.matches("input:not([type=checkbox]), textarea"); }
  document.addEventListener("focusin", function (e) { if (typingField(e.target)) win("typing", 1); });
  document.addEventListener("focusout", function (e) { if (typingField(e.target)) win("typing", 0); });
  document.addEventListener("mouseup", function (e) { if (e.button === 0 && !typingField(e.target) && !e.target.closest("select")) win("release"); });
  document.addEventListener("keydown", function (e) {
    if (typingField(e.target)) { if (e.key === "Enter") e.target.blur(); return; }
    if (e.ctrlKey && e.key === "z") action("undo");
    if (e.ctrlKey && (e.key === "y" || (e.shiftKey && e.key === "Z"))) action("redo");
  });

  // ---- Entry points --------------------------------------------------------------------
  function renderAll() {
    if (!S) return;
    renderBar(); renderConfigs(); renderList(); renderInsp(); renderStatus(); renderMap();
    $("b-paths").className = "btn small" + (ui.paths ? " on" : "");
    $("b-snap").className = "btn small" + (ui.snap ? " on" : "");
  }
  slm.onLang = function (dict) { L = dict || {}; applyLang(); renderAll(); };
  slm.onLangs = function () {};
  slm.onState = function (st) {
    var firstAircraft = !S || S.aircraft.acf_file !== st.aircraft.acf_file;
    if (ui.drag) { version = -1; return; }  // never replace the state under a gesture; asked again next poll
    S = st;
    var m = S.message;
    if (m && m.key === "placement.msg.added" && m.vars && m.vars.uid && ui.placed !== m.vars.uid) {
      ui.sel = { kind: "veh", id: m.vars.uid };
      ui.placed = m.vars.uid;  // le message reste dans l'etat : selectionne une seule fois
    }
    if (ui.sel && ui.sel.kind === "veh" && !vehicle(ui.sel.id)) ui.sel = null;
    if (firstAircraft) recenter();
    if (document.activeElement && typingField(document.activeElement)) { renderBar(); renderConfigs(); renderList(); renderStatus(); renderMap(); return; }  // don't fight the user's typing
    renderAll();
  };
  applyLang();
})();
</script>
</body>
</html>
